function abrirPerfilUsuario(
    usuario,
    abaInicial
) {

    mostrarSomente(
        "perfil"
    );


    atualizarNav(
        "perfil"
    );


    var conta =
        buscarConta(
            usuario
        );


    if (
        !conta
    ) {

        return;

    }


    var ehMeuPerfil =
        conta.usuario ===
        usuarioAtual;


    /* FOTO */

    var foto =
        document.getElementById(
            "perfilFotoNova"
        );


    foto.innerHTML =
        "";


    if (
        conta.fotoPerfil
    ) {

        var imagem =
            document.createElement(
                "img"
            );


        imagem.src =
            conta.fotoPerfil;


        foto.appendChild(
            imagem
        );

    }

    else {

        foto.textContent =
            (
                conta.nome ||
                "U"
            )
            .charAt(0)
            .toUpperCase();

    }


    /* NOME */

    document.getElementById(
        "perfilNomeNovo"
    ).textContent =
        conta.nome ||
        "Usuário";


    document.getElementById(
        "perfilUsuarioNovo"
    ).textContent =
        "@" +
        (
            conta.usuario ||
            ""
        );


    /* BIO */

    var bio =
        document.getElementById(
            "perfilBioNova"
        );


    bio.textContent =
        conta.bio ||
        "";


    bio.style.display =
        conta.bio
            ? "block"
            : "none";


    /* CONTADORES */

    var seguidores =
        pegarSeguidores(
            conta.usuario
        );


    var seguindo =
        pegarSeguindo(
            conta.usuario
        );


    var publicacoes =
        pegarPublicacoes()
            .filter(
                function(publicacao) {

                    return publicacao.usuario ===
                        conta.usuario;

                }
            );


    document.getElementById(
        "numeroSeguidoresPerfil"
    ).textContent =
        seguidores.length;


    document.getElementById(
        "numeroSeguindoPerfil"
    ).textContent =
        seguindo.length;


    document.getElementById(
        "numeroPublicacoesPerfil"
    ).textContent =
        publicacoes.length;


    /* BOTÕES */

    var acoes =
        document.getElementById(
            "perfilAcoesNovas"
        );


    acoes.innerHTML =
        "";


    if (
        ehMeuPerfil
    ) {

        var editar =
            document.createElement(
                "button"
            );


        editar.className =
            "botao-perfil-principal";


        editar.textContent =
            "Editar perfil";


        editar.onclick =
            function() {

                window.location.href =
                    "configuracoes.html";

            };


        acoes.appendChild(
            editar
        );

        var botaoSair =
            document.createElement(
                "button"
            );

        botaoSair.className =
            "botao-perfil-secundario";

        botaoSair.textContent =
            "Sair da conta";

        botaoSair.onclick =
            function() {
                abrirModalSaida();
            };

        acoes.appendChild(
            botaoSair
        );

    }

    else {

        var seguindoAtual =
            pegarSeguindo(
                usuarioAtual
            );


        var seguidoresPessoa =
            pegarSeguidores(
                conta.usuario
            );


        var euSigo =
            seguindoAtual.includes(
                conta.usuario
            );


        var elaMeSegue =
            seguidoresPessoa.includes(
                usuarioAtual
            );


        var botaoSeguir =
            document.createElement(
                "button"
            );


        botaoSeguir.className =
            "botao-perfil-principal";


        if (
            euSigo
        ) {

            botaoSeguir.textContent =
                "Seguindo";

        }

        else if (
            elaMeSegue
        ) {

            botaoSeguir.textContent =
                "Seguir de volta";

        }

        else {

            botaoSeguir.textContent =
                "Seguir";

        }


        botaoSeguir.onclick =
            function() {

                alternarSeguir(
                    conta.usuario
                );


                abrirPerfilUsuario(
                    conta.usuario
                );

            };


        var botaoMensagem =
            document.createElement(
                "button"
            );


        botaoMensagem.className =
            "botao-perfil-secundario";


        botaoMensagem.textContent =
            "Mensagem";


        botaoMensagem.onclick =
            function() {

                window.location.href =
                    "mensagens.html?usuario=" +
                    encodeURIComponent(
                        conta.usuario
                    );

            };


        acoes.appendChild(
            botaoSeguir
        );


        acoes.appendChild(
            botaoMensagem
        );

    }


    document.getElementById(
        "criarFotos"
    ).style.display =
        ehMeuPerfil
            ? "block"
            : "none";


    document.getElementById(
        "criarVideos"
    ).style.display =
        ehMeuPerfil
            ? "block"
            : "none";


    carregarConteudoPerfil(
        conta.usuario
    );


    trocarAbaPerfil(
        abaInicial || "fotos"
    );

}


function trocarAbaPerfil(
    aba
) {

    var fotos =
        document.getElementById(
            "abaFotos"
        );


    var videos =
        document.getElementById(
            "abaVideos"
        );


    var conteudoFotos =
        document.getElementById(
            "conteudoFotos"
        );


    var conteudoVideos =
        document.getElementById(
            "conteudoVideos"
        );


    if (
        aba === "fotos"
    ) {

        fotos.classList.add(
            "ativa"
        );

        videos.classList.remove(
            "ativa"
        );


        conteudoFotos.classList.add(
            "ativa"
        );

        conteudoVideos.classList.remove(
            "ativa"
        );

    }

    else {

        fotos.classList.remove(
            "ativa"
        );

        videos.classList.add(
            "ativa"
        );


        conteudoFotos.classList.remove(
            "ativa"
        );

        conteudoVideos.classList.add(
            "ativa"
        );

    }

}


function carregarConteudoPerfil(
    usuario
) {

    var publicacoes =
        pegarPublicacoes()
            .filter(
                function(publicacao) {

                    return publicacao.usuario ===
                        usuario;

                }
            );


    var fotos =
        publicacoes.filter(
            function(publicacao) {

                return publicacao.tipo !==
                    "video";

            }
        );


    var videos =
        publicacoes.filter(
            function(publicacao) {

                return publicacao.tipo ===
                    "video";

            }
        );


    montarGradePerfil(
        "gradeFotos",
        "vazioFotos",
        fotos
    );


    montarGradePerfil(
        "gradeVideos",
        "vazioVideos",
        videos
    );


}


function montarGradePerfil(
    gradeId,
    vazioId,
    publicacoes
) {

    var grade =
        document.getElementById(
            gradeId
        );


    var vazio =
        document.getElementById(
            vazioId
        );


    grade.innerHTML =
        "";


    if (
        publicacoes.length === 0
    ) {

        vazio.style.display =
            "block";

        return;

    }


    vazio.style.display =
        "none";


    for (
        var i = 0;
        i < publicacoes.length;
        i++
    ) {

        var publicacao =
            publicacoes[i];


        var item =
            document.createElement(
                "div"
            );


        item.className =
            "item-grade-perfil";


        if (
            publicacao.tipo ===
            "video"
        ) {

            var video =
                document.createElement(
                    "video"
                );


            video.src =
                publicacao.arquivo;

            video.muted =
                true;

            video.preload =
                "metadata";


            item.appendChild(
                video
            );


            var indicador =
                document.createElement(
                    "div"
                );


            indicador.className =
                "indicador-video-perfil";


            indicador.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <path d="M8 5l11 7-11 7Z"></path>
                </svg>
            `;


            item.appendChild(
                indicador
            );

        }

        else {

            var imagem =
                document.createElement(
                    "img"
                );


            imagem.src =
                publicacao.arquivo;


            item.appendChild(
                imagem
            );

        }


        item.onclick =
            function(
                publicacaoSelecionada
            ) {

                return function() {

                    abrirPublicacaoDoPerfil(
                        publicacaoSelecionada
                    );

                };

            }(
                publicacao
            );


        grade.appendChild(
            item
        );

    }

}


function abrirPublicacaoDoPerfil(
    publicacao
) {

    alert(
        "Publicação selecionada."
    );

}


/* =====================================================
   SEGUIR
===================================================== */

function alternarSeguir(
    usuario
) {

    var seguindo =
        pegarSeguindo(
            usuarioAtual
        );


    var seguidores =
        pegarSeguidores(
            usuario
        );


    var posSeguindo =
        seguindo.indexOf(
            usuario
        );


    var posSeguidor =
        seguidores.indexOf(
            usuarioAtual
        );


    if (
        posSeguindo === -1
    ) {

        seguindo.push(
            usuario
        );


        if (
            posSeguidor === -1
        ) {

            seguidores.push(
                usuarioAtual
            );

        }


        salvarSeguindo(
            usuarioAtual,
            seguindo
        );


        salvarSeguidores(
            usuario,
            seguidores
        );


        criarNotificacao(
            usuario,
            "follow",
            nomeUsuario +
            " começou a seguir você.",
            usuarioAtual
        );

    }

    else {

        seguindo.splice(
            posSeguindo,
            1
        );


        if (
            posSeguidor !== -1
        ) {

            seguidores.splice(
                posSeguidor,
                1
            );

        }


        salvarSeguindo(
            usuarioAtual,
            seguindo
        );


        salvarSeguidores(
            usuario,
            seguidores
        );

    }


    atualizarBadgeNotificacoes();

}

function abrirNotificacoes() {

    mostrarSomente(
        "notificacoes"
    );


    atualizarNav(
        "notificacoes"
    );


    carregarNotificacoes();

}


function carregarNotificacoes() {

    var lista =
        document.getElementById(
            "listaNotificacoes"
        );


    var notificacoes =
        pegarNotificacoes();


    lista.innerHTML =
        "";


    if (
        notificacoes.length === 0
    ) {

        var vazio =
            document.createElement(
                "div"
            );


        vazio.className =
            "vazio";


        vazio.textContent =
            "Você ainda não tem notificações.";


        lista.appendChild(
            vazio
        );


        atualizarBadgeNotificacoes();

        return;

    }


    for (
        var i = 0;
        i < notificacoes.length;
        i++
    ) {

        var n =
            notificacoes[i];


        var item =
            document.createElement(
                "div"
            );


        item.className =
            "notificacao-item";


        if (
            !n.lida
        ) {

            item.classList.add(
                "nao-lida"
            );

        }


        var avatar =
            document.createElement(
                "div"
            );


        avatar.className =
            "notificacao-avatar";


        var conta =
            buscarConta(
                n.usuario
            );


        if (
            conta &&
            conta.fotoPerfil
        ) {

            var img =
                document.createElement(
                    "img"
                );


            img.src =
                conta.fotoPerfil;


            avatar.appendChild(
                img
            );

        }

        else {

            avatar.textContent =
                (
                    conta &&
                    conta.nome
                        ? conta.nome
                        : "U"
                )
                .charAt(0)
                .toUpperCase();

        }


        var texto =
            document.createElement(
                "div"
            );


        texto.className =
            "notificacao-texto";


        texto.textContent =
            n.texto;


        var data =
            document.createElement(
                "div"
            );


        data.className =
            "notificacao-data";


        data.textContent =
            n.data;


        texto.appendChild(
            data
        );


        item.appendChild(
            avatar
        );


        item.appendChild(
            texto
        );


        item.onclick =
            function(
                notificacao
            ) {

                return function() {

                    notificacao.lida =
                        true;


                    salvarNotificacoes(
                        notificacoes
                    );


                    carregarNotificacoes();

                };

            }(
                n
            );


        lista.appendChild(
            item
        );

    }


    atualizarBadgeNotificacoes();

}


function atualizarBadgeNotificacoes() {

    var notificacoes =
        pegarNotificacoes();


    var quantidade =
        notificacoes.filter(
            function(n) {

                return !n.lida;

            }
        ).length;


    var badge =
        document.getElementById(
            "badgeNotificacoes"
        );


    if (
        quantidade > 0
    ) {

        badge.textContent =
            quantidade > 99
                ? "99+"
                : quantidade;


        badge.classList.add(
            "ativo"
        );

    }

    else {

        badge.classList.remove(
            "ativo"
        );

    }

}
